<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="UAsset — a premium library of beautiful SVG icons for modern digital products."
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>UAsset — Premium SVG Icons</title>

  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/pages.css">
</head>

<body>
  <div id="app">
    <header id="site-header"></header>

    <main id="main-content">
      <section
        id="icon-library"
        aria-label="SVG icon library"
      >
        <div id="icon-library-content"></div>
      </section>
    </main>

    <div id="icon-modal"></div>
    <div id="toast-container" aria-live="polite"></div>
  </div>

  <noscript>
    <p>
      UAsset requires JavaScript to browse and use the icon library.
      Please enable JavaScript in your browser.
    </p>
  </noscript>

  <script type="module" src="/frontend/app.js"></script>
</body>
</html>
